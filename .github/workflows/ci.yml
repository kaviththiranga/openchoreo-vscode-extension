name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - name: End-to-end tests (real VS Code)
        working-directory: packages/extension
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
          xvfb-run -a pnpm test:e2e
      - run: pnpm package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: packages/extension/*.vsix
          if-no-files-found: error
      - name: Demo footage (scenes that need no cluster)
        working-directory: packages/extension
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          DEMO_VSIX=$(ls *.vsix) xvfb-run -a --server-args="-screen 0 1920x1080x24" pnpm demo:capture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-footage
          path: packages/extension/demo-output/
          if-no-files-found: warn
