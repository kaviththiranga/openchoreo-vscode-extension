name: Update OpenChoreo skills

# Pins the latest commit of github.com/openchoreo/skills (openchoreoSkills.ref in
# packages/extension/package.json) and opens a pull request. Needs "Allow GitHub
# Actions to create and approve pull requests" in the repository settings.
# Pull requests opened with the workflow token don't trigger CI, so this job
# builds and tests before opening one.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Pin the latest upstream commit
        id: pin
        working-directory: packages/extension
        run: |
          latest=$(git ls-remote https://github.com/openchoreo/skills HEAD | cut -f1)
          current=$(node -p "require('./package.json').openchoreoSkills.ref")
          echo "short=${latest:0:12}" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            node scripts/sync-skills.mjs --ref "$latest" --required
          fi
      - if: steps.pin.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
      - name: Open a pull request
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ steps.pin.outputs.short }}
        run: |
          branch="chore/openchoreo-skills-$SHORT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -s -am "chore: update OpenChoreo skills to $SHORT"
          git push -f origin "$branch"
          gh pr view "$branch" >/dev/null 2>&1 || gh pr create --head "$branch" \
            --title "chore: update OpenChoreo skills to $SHORT" \
            --body "Pins github.com/openchoreo/skills at $SHORT. Built and unit-tested by the workflow."
