name: Release

# Push a tag matching the extension version (e.g. v0.2.0) to build, test,
# create a GitHub release with the .vsix, and publish it:
#   VS Code Marketplace — Trusted Publishing (OIDC): the KavithLokuhewage publisher
#     has a policy for this repository and release.yml, so no token is stored
#   Open VSX — only when the OVSX_PAT secret (Open VSX access token) is set

on:
  push:
    tags: ['v*']
  # Re-publish an existing tag, e.g. after adding a token secret.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.2.0)
        required: true

permissions:
  contents: write
  # Trusted Publishing: vsce exchanges the job's GitHub OIDC token for a Marketplace credential.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Check the tag matches the extension version
        run: |
          version=$(node -p "require('./packages/extension/package.json').version")
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match packages/extension version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - name: End-to-end tests (real VS Code)
        working-directory: packages/extension
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
          xvfb-run -a pnpm test:e2e
      - run: pnpm package

      - name: Release notes from the changelog
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' packages/extension/CHANGELOG.md | sed '/./,$!d' > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md" > release-notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vsix="packages/extension/openchoreo-unofficial-${VERSION}.vsix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$vsix" --clobber
          else
            gh release create "$TAG" "$vsix" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi

      - name: Publish to the VS Code Marketplace
        # Forks have no Trusted Publishing policy for the publisher.
        if: github.repository == 'kaviththiranga/openchoreo-vscode-extension'
        working-directory: packages/extension
        # --oidc needs vsce 4; the devDependency (3.x) only packages.
        run: npx -y @vscode/vsce@4.1.1 publish --oidc --packagePath "openchoreo-unofficial-${VERSION}.vsix"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: packages/extension
        run: npx ovsx@1.3.0 publish "openchoreo-unofficial-${VERSION}.vsix" -p "$OVSX_PAT"

      - name: Note skipped publishing
        if: env.OVSX_PAT == ''
        run: echo "::warning::OVSX_PAT is not set — skipped Open VSX publishing"
